<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>404 | NOVA AI Agency</title>
<meta name="theme-color" content="#0B1220">
<!-- GitHub Pages serves this file for any missing URL, from any depth,
     so every path below is absolute from the repository path /nova-agency/ -->
<link rel="icon" href="/nova-agency/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/nova-agency/css/style.css">
<style>
  body { background: var(--navy); color: var(--on-navy); min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px var(--gut); }
  .nf { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; max-width: 560px; }
  .nf img { height: 30px; width: auto; }
  .nf .code { font-size: clamp(5rem, 22vw, 9rem); line-height: 1; font-weight: 700; color: var(--violet); letter-spacing: -.04em; }
  .nf h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.3; }
  .nf p { color: var(--on-navy-2); }
  .nf .en { display: block; margin-top: 4px; text-align: start; font-family: var(--font-en); font-size: .7em; font-weight: 600; }
  .nf p .en { font-weight: 400; font-size: .9em; }
</style>
</head>
<body>
  <main class="nf">
    <img src="/nova-agency/assets/logo/nova-logo-white.svg" alt="NOVA" width="130" height="30">
    <span class="code" aria-hidden="true">404</span>
    <h1>الصفحة غير موجودة<span class="en" lang="en" dir="ltr">Page not found</span></h1>
    <p>الرابط الذي فتحته غير صحيح أو تم نقله.<span class="en" lang="en" dir="ltr">The link may be wrong, or the page was moved.</span></p>
    <a class="btn btn--light" href="/nova-agency/">العودة للرئيسية</a>
  </main>
</body>
</html>
